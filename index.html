<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎解きゲーム</title>
    <style>
        /* === 基本スタイル === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 24px 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        /* === 入力・正誤判定表示エリア（可変レイアウト） === */
        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        /* マークがないときは中央寄せにするためのラッパー */
        .input-with-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* === 5つの独立したテキストボックス === */
        .code-input-wrapper {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .code-box {
            width: 42px;
            height: 52px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #555;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #fff;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .code-box:focus {
            outline: none;
            border-color: #007bff;
            background-color: #333;
        }

        /* === 問題画面＆タブ === */
        .page-tabs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background-color: #333;
            color: #888;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background-color: #007bff;
            color: #fff;
        }

        .tab-btn:disabled {
            background-color: #222;
            color: #444;
            cursor: not-allowed;
        }

        .question-page {
            display: none;
        }

        .question-page.active {
            display: block;
        }

        .image-wrapper {
            width: 100%;
            height: 240px;
            background-color: #2a2a2a;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .quiz-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 問題回答テキストボックス */
        .answer-box {
            width: 220px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #555;
            border-radius: 6px;
            background-color: #fff;
            color: #000;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s;
        }

        .submit-btn {
            width: 80%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #218838;
        }

        /* 判定マーク */
        .quiz-status-mark {
            font-size: 32px;
            font-weight: bold;
            width: 0;
            opacity: 0;
            overflow: hidden;
            text-align: center;
            line-height: 1;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .quiz-status-mark.show {
            width: 40px;
            opacity: 1;
            margin-left: 8px;
        }

        /* 正誤表示パーツ */
        .circle { color: #28a745; }
        .cross { color: #ff4d4d; }

        .code-box.is-correct-text,
        .answer-box.is-correct-text {
            color: #28a745 !important;
            border-color: #28a745 !important;
        }

        .code-box.is-error-text,
        .answer-box.is-error-text {
            color: #ff4d4d !important;
            border-color: #ff4d4d !important;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* === 4問目クリア後のバナー === */
        #climax-banner {
            display: none;
            margin-top: 25px;
            padding: 24px 10px;
            background-color: #000;
            border: 2px solid #ff4d4d;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
            animation: fadeIn 0.8s ease-in-out;
        }

        .climax-text {
            color: #ff4d4d;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.15em;
            text-shadow: 0 0 8px rgba(255, 77, 77, 0.7);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === クリア画面 === */
        .clear-container {
            text-align: center;
            padding: 30px 10px;
            position: relative;
        }

        .clear-title {
            font-size: 36px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px #ff9900, 0 0 20px #ff6600;
            margin-bottom: 20px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .clear-card {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 25px 15px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }

        .clear-message {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .camera-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        .confetti-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 12px;
            opacity: 0.8;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="game-container">

    <!-- ================= 画面1: 招待コード入力画面 ================= -->
    <div class="screen active" id="invite-screen">
        <h1>コードを入力</h1>
        <form id="invite-form">
            <div class="input-group">
                <div class="input-with-mark">
                    <div class="code-input-wrapper">
                        <input type="text" class="code-box" maxlength="1" autocomplete="off">
                        <input type="text" class="code-box" maxlength="1" autocomplete="off">
                        <input type="text" class="code-box" maxlength="1" autocomplete="off">
                        <input type="text" class="code-box" maxlength="1" autocomplete="off">
                        <input type="text" class="code-box" maxlength="1" autocomplete="off">
                    </div>
                    <div class="quiz-status-mark" id="main-status-mark"></div>
                </div>
            </div>
            <button type="submit" class="submit-btn">送信</button>
        </form>
    </div>

    <!-- ================= 画面2: 問題画面（1〜4問） ================= -->
    <div class="screen" id="question-screen">
        <div class="page-tabs">
            <button class="tab-btn active" id="tab-0" onclick="switchQuestion(0)">1</button>
            <button class="tab-btn" id="tab-1" disabled onclick="switchQuestion(1)">2</button>
            <button class="tab-btn" id="tab-2" disabled onclick="switchQuestion(2)">3</button>
            <button class="tab-btn" id="tab-3" disabled onclick="switchQuestion(3)">4</button>
        </div>

        <!-- 第1問 -->
        <div class="question-page active" id="q-page-0">
            <h2>第１問</h2>
            <div class="image-wrapper">
                <img src="1monme.png" alt="第1問画像" class="quiz-image">
            </div>
            <form class="quiz-form">
                <div class="input-group">
                    <div class="input-with-mark">
                        <input type="text" class="answer-box" placeholder="ひらがな3文字で入力" required autocomplete="off">
                        <div class="quiz-status-mark"></div>
                    </div>
                </div>
                <button type="submit" class="submit-btn">答える</button>
            </form>
        </div>

        <!-- 第2問 -->
        <div class="question-page" id="q-page-1">
            <h2>第２問</h2>
            <div class="image-wrapper">
                <img src="2monme.png" alt="第2問画像" class="quiz-image">
            </div>
            <form class="quiz-form">
                <div class="input-group">
                    <div class="input-with-mark">
                        <input type="text" class="answer-box" placeholder="ひらがな3文字で入力" required autocomplete="off">
                        <div class="quiz-status-mark"></div>
                    </div>
                </div>
                <button type="submit" class="submit-btn">答える</button>
            </form>
        </div>

        <!-- 第3問 -->
        <div class="question-page" id="q-page-2">
            <h2>第３問</h2>
            <div class="image-wrapper">
                <img src="3monme.png" alt="第3問画像" class="quiz-image">
            </div>
            <form class="quiz-form">
                <div class="input-group">
                    <div class="input-with-mark">
                        <input type="text" class="answer-box" placeholder="ひらがな3文字で入力" required autocomplete="off">
                        <div class="quiz-status-mark"></div>
                    </div>
                </div>
                <button type="submit" class="submit-btn">答える</button>
            </form>
        </div>

        <!-- 第4問 -->
        <div class="question-page" id="q-page-3">
            <h2>第４問</h2>
            <div class="image-wrapper">
                <img src="lastQuestion.png" alt="第4問画像" class="quiz-image">
            </div>
            <form class="quiz-form">
                <div class="input-group">
                    <div class="input-with-mark">
                        <input type="text" class="answer-box" placeholder="ひらがな3文字で入力" required autocomplete="off">
                        <div class="quiz-status-mark"></div>
                    </div>
                </div>
                <button type="submit" class="submit-btn">答える</button>
            </form>
        </div>

        <!-- 4問目クリア時の下部バナー -->
        <div id="climax-banner">
            <div>LAST MISSION</div>
            <div class="climax-text">「クライマックス」を迎えろ</div>
        </div>
    </div>

    <!-- ================= 画面3: クリア画面 ================= -->
    <div class="screen" id="clear-screen">
        <div class="confetti-wrapper" id="confetti-wrapper"></div>
        <div class="clear-container">
            <h1 class="clear-title">🎉 GAME CLEAR! 🎉</h1>
            <div class="clear-card">
                <span class="camera-icon">📸</span>
                <div class="clear-message">
                    この画面をスクショして<br>報告しよう！
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // === 設定・答え ===
    const correctAnswers = ["とさか", "こだま", "うでわ", "てすと"];
    let isClimaxPrepared = false;

    // === 1. 5つのテキストボックスの入力制御（増殖バグ対策済み） ===
    const codeBoxes = document.querySelectorAll('.code-box');

    codeBoxes.forEach((box, index) => {
        // 日本語入力変換中のイベント重複を抑止
        let isComposing = false;

        box.addEventListener('compositionstart', () => { isComposing = true; });
        box.addEventListener('compositionend', (e) => {
            isComposing = false;
            handleBoxInput(box, index, e.data || box.value);
        });

        box.addEventListener('input', (e) => {
            if (!isComposing) {
                handleBoxInput(box, index, box.value);
            }
        });

        box.addEventListener('keydown', (e) => {
            // バックスペースで文字が空なら前のボックスへ戻る
            if (e.key === 'Backspace' && box.value === '' && index > 0) {
                codeBoxes[index - 1].focus();
            }
        });
    });

    // 入力値の1文字制限・自動大文字化・フォーカス移動制御
    function handleBoxInput(box, index, val) {
        if (!val) return;

        // 最新の1文字のみを取り出して大文字化（重複入力増殖の防止）
        const char = val.slice(-1).toUpperCase();
        box.value = char;

        // 次のボックスへカーソルを自動移動
        if (char !== '' && index < codeBoxes.length - 1) {
            codeBoxes[index + 1].focus();
        }
    }

    // === 2. 招待コードフォーム送信（SEITO / CLIMA / CLIMAX 判定） ===
    const inviteForm = document.getElementById('invite-form');
    const mainStatusMark = document.getElementById('main-status-mark');

    inviteForm.addEventListener('submit', (e) => {
        e.preventDefault();

        // 5つのマスの文字を連結
        let codeUpper = "";
        codeBoxes.forEach(box => codeUpper += box.value);
        codeUpper = codeUpper.trim().toUpperCase();

        // A. 「CLIMA」入力後の2回目送信でクリア画面へ
        if (isClimaxPrepared && (codeUpper === "CLIMA" || codeUpper === "CLIMAX")) {
            createConfetti();
            showScreen('clear-screen');
            return;
        }

        // B. 正解：「SEITO」
        if (codeUpper === "GUEST") {
            showStatusMark(mainStatusMark, "〇", "circle");
            codeBoxes.forEach(box => box.classList.add('is-correct-text'));

            setTimeout(() => {
                showScreen('question-screen');
            }, 1000);

        // C. 伏線「CLIMA」の初回入力時（バツ固定演出）
        } else if (codeUpper === "CLIMA") {
            showStatusMark(mainStatusMark, "✕", "cross");
            codeBoxes.forEach(box => box.classList.add('is-error-text'));
            isClimaxPrepared = true;

        // D. 不正解の場合
        } else {
            showStatusMark(mainStatusMark, "✕", "cross");
            codeBoxes.forEach(box => box.classList.add('is-error-text'));

            setTimeout(() => {
                codeBoxes.forEach(box => {
                    box.value = "";
                    box.classList.remove('is-error-text');
                });
                hideStatusMark(mainStatusMark);
                codeBoxes[0].focus();
            }, 1800);
        }
    });

    // === 3. 問題画面の切り替え ===
    function switchQuestion(index) {
        const pages = document.querySelectorAll('.question-page');
        const tabs = document.querySelectorAll('.tab-btn');

        pages.forEach((page, i) => {
            page.classList.toggle('active', i === index);
        });

        tabs.forEach((tab, i) => {
            tab.classList.toggle('active', i === index);
        });
    }

    // === 4. 問題の正誤判定 ===
    const quizForms = document.querySelectorAll('.quiz-form');

    quizForms.forEach((quizForm, index) => {
        quizForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const answerBox = quizForm.querySelector('.answer-box');
            const quizStatusMark = quizForm.querySelector('.quiz-status-mark');
            const userAnswer = answerBox.value.trim();

            answerBox.classList.remove('is-error-text', 'is-correct-text');

            if (userAnswer === correctAnswers[index]) {
                answerBox.classList.add('is-correct-text');
                showStatusMark(quizStatusMark, "〇", "circle");

                setTimeout(() => {
                    const nextIndex = index + 1;

                    if (nextIndex < correctAnswers.length) {
                        const nextTab = document.getElementById(`tab-${nextIndex}`);
                        if (nextTab) nextTab.disabled = false;
                        switchQuestion(nextIndex);
                    } else {
                        // 4問目クリア演出（クライマックスバナー表示＆自動スクロール）
                        const banner = document.getElementById('climax-banner');
                        banner.style.display = "block";
                        
                        setTimeout(() => {
                            banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 200);
                    }
                }, 1200);

            } else {
                answerBox.classList.add('is-error-text');
                showStatusMark(quizStatusMark, "✕", "cross");

                setTimeout(() => {
                    answerBox.classList.remove('is-error-text');
                    answerBox.value = "";
                    hideStatusMark(quizStatusMark);
                    answerBox.focus();
                }, 1800);
            }
        });
    });

    // === マーク表示/非表示補助関数 ===
    function showStatusMark(element, text, colorClass) {
        element.textContent = text;
        element.className = `quiz-status-mark show ${colorClass}`;
    }

    function hideStatusMark(element) {
        element.textContent = "";
        element.className = "quiz-status-mark";
    }

    // === 画面表示切り替え ===
    function showScreen(screenId) {
        const screens = document.querySelectorAll('.screen');
        screens.forEach(screen => {
            screen.classList.toggle('active', screen.id === screenId);
        });
    }

    // === クリア画面のクラッカー演出 ===
    function createConfetti() {
        const wrapper = document.getElementById('confetti-wrapper');
        const colors = ['#ffd700', '#ff4d4d', '#28a745', '#007bff', '#ffffff'];
        wrapper.innerHTML = "";

        for (let i = 0; i < 40; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 2 + 's';
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            wrapper.appendChild(confetti);
        }
    }
</script>

</body>
</html>
